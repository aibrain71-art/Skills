name: Scooter Rush – Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'escooter-game/**'
      - '.github/workflows/scooter-rush-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: escooter-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: escooter-game/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: escooter-game/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk scooter-rush.apk
      - uses: actions/upload-artifact@v4
        with:
          name: scooter-rush-apk
          path: escooter-game/scooter-rush.apk
